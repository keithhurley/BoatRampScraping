[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:shiny]
# Run Shiny App on port 3839 (Nginx proxies 3838 -> 3839)
command=R -e "shiny::runApp('/app/app2.R', port=3839, host='0.0.0.0')"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:plumber]
# Run Plumber API on port 8000 (Nginx proxies /api -> 8000)
command=R -e "pr <- plumber::plumb('/app/api2.R'); pr$run(port=8000, host='0.0.0.0', docs=TRUE)"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
